[pytest]
testpaths =
	src/tests
	packages/company_cleanse/tests
	packages/company_tokenize/tests
	packages/company_classify/tests
	packages/company_perturbation/tests
	packages/company_vectorize/tests
python_files = test_*.py
pythonpath =
	.
	src
	scripts
	tooling
	packages/company_cleanse/src
	packages/company_tokenize/src
	packages/company_classify/src
	packages/company_perturbation/src
	packages/company_vectorize/src
addopts = -v --tb=short --import-mode=importlib
markers =
	performance: long-running benchmark tests (opt-in)
	integration: broad, stage-level tests spanning multiple modules (opt-out for fast iteration)
	graphics: tests that render a picture to disk through the plotting library (opt-out for fast iteration)