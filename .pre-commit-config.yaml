repos:
  # Local rather than astral-sh/ruff-pre-commit: that repo requires a pinned `rev`,
  # which is a second place to version a tool pyproject.toml already declares. The two
  # drifted five minor versions apart (hook v0.11.3 against the project's 0.16.0) and
  # the older one reported 106 E402s on the sys.path shim every directly-runnable
  # script needs, none of which the documented `ruff check src scripts packages`
  # invocation ever saw. Every other Python hook here already runs `uv run`.
  #
  # Each checkout, every worktree included, has its own `.venv`, so the sync `uv run`
  # makes before a hook touches only the checkout running the gate.
  #
  # Invoke it as `pre-commit run ...`, never `uv run pre-commit run ...`.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      # The workspace path contract: a script takes the three workspace roots and otherwise
      # only types and parameters, and nothing outside src/workspace composes a location.
      # Each file is held to its lines in src/tests/baselines/workspace_paths.txt (and the
      # jurisdiction_code= literals to layer_path_literals.txt), so a commit fails only on
      # an offence beyond what its files already carried; each area's script-wiring item
      # clears its own lines. test_layer_path_literals.py pins the repo-wide backlogs.
      - id: workspace-paths
        name: workspace path contract
        entry: uv run python scripts/check_layer_path_literals.py
        language: system
        types: [python]
        files: ^(src|scripts)/
        stages: [pre-commit]
      # Markdown indents with spaces. Tab indentation reached three markdown files as an
      # editor artefact, and every tool that cuts and pastes markdown has to preserve
      # whatever it finds, so one convention is cheaper than two.
      - id: no-tabs-in-markdown
        name: no tab indentation in markdown
        entry: '^\t'
        language: pygrep
        types: [markdown]
        stages: [pre-commit]

  # `rust-test-wikisieve` is a whole-crate build (cargo has no per-file mode), so
  # `pre-push` rather than `pre-commit` -- see the `bandit` hook below for why that
  # split exists.
  - repo: local
    hooks:
      - id: rust-test-wikisieve
        name: rust test (wikisieve)
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_wikisieve.ps1 -UseVsDevCmd -VsDevCmdPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -CargoSubcommand test
        language: system
        files: ^src/rust/wikisieve/
        pass_filenames: false
        stages: [pre-push]

  # `-r src scripts packages` scans the whole Python tree regardless of which files
  # changed (bandit has no incremental mode), so this is a `pre-push` sweep, not a
  # per-commit check -- `pre-commit run --files <paths>` (the per-commit gate) would
  # otherwise silently re-scan everything on every commit no matter how small.
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r src scripts packages -x "*/tests/*,*/tests" -s B105
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --ignore-missing-imports
        language: system
        types: [python]
        stages: [pre-commit]

  # Whole-tree sweeps (module boundaries / README consistency), not per-file checks.
  - repo: local
    hooks:
      - id: tach-check
        name: tach check (module boundaries)
        entry: uv run tach check
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: check-package-docs
        name: package README consistency
        entry: uv run python tooling/check_package_docs.py
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: design-artifact-freshness
        name: design artifact freshness (pyscn/graphify)
        entry: uv run python tooling/design_artifact_status.py
        language: system
        pass_filenames: false
        verbose: true
        stages: [pre-push]

  # Network-dependent (queries PyPI's advisory API): `manual` so a flaky connection
  # can't block a push, alongside `rust-audit-wikidata` above for the same reason.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit --skip-editable
        language: system
        pass_filenames: false
        stages: [manual]
