[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "company_vectorize"
version = "0.1.0"
description = "Vectorization routines and pgvector/HNSW helpers for company-name workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Paul Hatcher" }
]
dependencies = [
  "company-cleanse",
  "usearch>=2.26.2",
]

[project.optional-dependencies]
sbert = [
  "sentence-transformers",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.uv.sources]
company_cleanse = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/company_vectorize"]

[tool.hatch.build.targets.sdist]
include = [
  "src/company_vectorize",
  "tests",
  "README.md",
]

[tool.hatch.build]
include = [
  "src/company_vectorize/py.typed",
  "src/company_vectorize/resources/sbert_models.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
